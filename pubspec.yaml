name: imagohub
description: ImagoHub — galeria e busca de fotografias, fiel ao wireframe fornecido.
publish_to: none
version: 1.0.2+3

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.2.2
  file_picker: ^13.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/photos/
    - assets/data/reference_photos.json
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
